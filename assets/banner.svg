<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="100%" height="auto">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffd200" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="cyanGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#00f0ff" />
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Card Background -->
  <rect width="1280" height="400" rx="16" fill="url(#bg)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.4" />

  <!-- Grid Perspective Lines (Retro Arcade Highway feel) -->
  <polygon points="460,400 820,400 660,250 620,250" fill="url(#roadGrad)" stroke="#334155" stroke-width="1.5" />
  <line x1="640" y1="250" x2="640" y2="400" stroke="#ffd200" stroke-width="5" stroke-dasharray="16,12" opacity="0.9" />

  <!-- Speed Lines -->
  <line x1="120" y1="360" x2="380" y2="360" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.3" />
  <line x1="900" y1="360" x2="1160" y2="360" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" opacity="0.3" />
  <line x1="80" y1="375" x2="300" y2="375" stroke="#ffd200" stroke-width="1.5" stroke-linecap="round" opacity="0.25" />
  <line x1="980" y1="375" x2="1200" y2="375" stroke="#ffd200" stroke-width="1.5" stroke-linecap="round" opacity="0.25" />

  <!-- Pill Header Badge -->
  <g transform="translate(470, 42)">
    <rect width="340" height="34" rx="17" fill="rgba(56, 189, 248, 0.15)" stroke="#38bdf8" stroke-width="1.2" />
    <text x="170" y="22" fill="#38bdf8" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="13" text-anchor="middle" letter-spacing="2">
      ★ ENDLESS HIGHWAY TRAFFIC RACER ★
    </text>
  </g>

  <!-- Big Logo Title -->
  <text x="640" y="145" text-anchor="middle" filter="url(#shadow)" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="76" letter-spacing="4">
    <tspan fill="#ffffff">SPEED</tspan><tspan fill="url(#goldText)">ORDER</tspan>
  </text>

  <!-- Tagline -->
  <text x="640" y="190" text-anchor="middle" fill="url(#cyanGlow)" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="20" letter-spacing="3">
    10 INDIAN STATES • 50 KM EXPEDITION • 42 UNIQUE VEHICLES
  </text>

  <!-- Feature Highlights Chips -->
  <g transform="translate(190, 215)">
    <!-- Chip 1 -->
    <rect x="0" y="0" width="200" height="38" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1.2" />
    <text x="100" y="24" fill="#fef08a" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" text-anchor="middle">
      🕌 10 State Monuments
    </text>

    <!-- Chip 2 -->
    <rect x="225" y="0" width="210" height="38" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" />
    <text x="330" y="24" fill="#bae6fd" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" text-anchor="middle">
      ⛽ 1 KM Pitstops &amp; Nitro
    </text>

    <!-- Chip 3 -->
    <rect x="460" y="0" width="210" height="38" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
    <text x="565" y="24" fill="#a7f3d0" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" text-anchor="middle">
      🏁 50 KM Finish Garage
    </text>

    <!-- Chip 4 -->
    <rect x="695" y="0" width="205" height="38" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1.2" />
    <text x="797" y="24" fill="#fbcfe8" font-family="'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="13" text-anchor="middle">
      🌃 Maharashtra Night City
    </text>
  </g>

  <!-- Bottom Badges Row -->
  <g transform="translate(380, 275)">
    <text x="260" y="22" fill="#94a3b8" font-family="'Segoe UI', Roboto, sans-serif" font-weight="600" font-size="14" text-anchor="middle" letter-spacing="1">
      Three.js WebGL &bull; PC &amp; Touch Controls &bull; 60 FPS Optimized &bull; Authentic Soner Kara Aesthetics
    </text>
  </g>
</svg>
